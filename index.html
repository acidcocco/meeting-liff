<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社區開會時間報名系統</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
    <p style="text-align: center; margin-top: 50px; font-family: sans-serif;">載入中，請稍候...</p>
    <script>
        async function main() {
            try {
                await liff.init({ liffId: "2010963662-kFFk6ETu" });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    const profile = await liff.getProfile();
                    const userId = profile.userId;
                    
                    // 填入您的 GAS 部署網址
                    const gasUrl = "https://script.google.com/macros/s/AKfycbzE4rnZzUup8evgzoQJrXk0hl_rUiSjTpOVcPonkC8STaCiKjp-LVjcaNDl2JyEbnv_SQ/exec";
                    
                    // 直接把畫面導向 GAS，並帶上 userId
                    window.location.replace(gasUrl + "?userId=" + userId);
                }
            } catch (error) {
                document.body.innerHTML = "<p style='text-align: center; margin-top: 50px; color: red;'>初始化失敗: " + error + "</p>";
            }
        }
        main();
    </script>
</body>
</html>
