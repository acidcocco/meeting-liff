<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>載入中...</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        const LIFF_ID = "2010963662-kFFk6ETu";
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzE4rnZzUup8evgzoQJrXk0hl_rUiSjTpOVcPonkC8STaCiKjp-LVjcaNDl2JyEbnv_SQ/exec";

        window.onload = async function() {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                const profile = await liff.getProfile();
                window.location.href = `${GAS_URL}?lineId=${profile.userId}&name=${encodeURIComponent(profile.displayName)}`;
            }
        };
    </script>
</head>
<body>
    <p style="text-align:center; margin-top:50px; font-family:sans-serif; color:#666;">系統正在安全登入中，請稍候...</p>
</body>
</html>
